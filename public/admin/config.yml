backend:
  name: github
  repo: robinsonjf/projeto001
  branch: main

local_backend: true

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "catalog"
    label: "Catálogo de Produtos"
    files:
      - file: "src/data/products.json"
        label: "Lista de Produtos"
        name: "products_list"
        fields:
          - name: "items"
            label: "Produtos"
            widget: "list"
            summary: "{{fields.name}} ({{fields.id}})"
            fields:
              - { label: "ID do Produto (slug da URL)", name: "id", widget: "string" }
              - { label: "Nome do Produto", name: "name", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "Preço", name: "price", widget: "string", default: "Sob Consulta" }
              - { label: "Status (Ex: EDIÇÃO LIMITADA • EM BREVE)", name: "status", widget: "string" }
              - { label: "Tag Esquerda (Card)", name: "tagLeft", widget: "string" }
              - { label: "Tag Direita (Card)", name: "tagRight", widget: "string" }
              - { label: "Descrição", name: "desc", widget: "text" }
              - { label: "Imagem Principal", name: "mainImage", widget: "string" }
              - { label: "Galeria de Imagens", name: "gallery", widget: "list", field: { label: "Caminho da Imagem", name: "image", widget: "string" } }
              - label: "Especificações Resumidas do Card"
                name: "cardSpecs"
                widget: "object"
                fields:
                  - { label: "Pena", name: "pena", widget: "string" }
                  - { label: "Material", name: "material", widget: "string" }
                  - { label: "Recarga", name: "recarga", widget: "string" }
              - label: "Tabela de Especificações Técnicas"
                name: "specs"
                widget: "list"
                fields:
                  - { label: "Rótulo", name: "label", widget: "string" }
                  - { label: "Valor", name: "value", widget: "string" }
              - label: "Destaques do Produto (Highlights)"
                name: "highlights"
                widget: "list"
                fields:
                  - { label: "Ícone Solar (Ex: solar:shield-check-bold-duotone)", name: "icon", widget: "string" }
                  - { label: "Título do Destaque", name: "title", widget: "string" }
                  - { label: "Descrição do Destaque", name: "desc", widget: "text" }
